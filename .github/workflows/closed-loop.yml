name: closed-loop test

# 增量构建（manifest 缓存 + partial clone）必须和从零构建、以及改造前的旧版 build.py
# 产出完全一致。见 tests/closed_loop.py。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # 要从历史里取出旧版 build.py 做对比
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install -r requirements.txt
    # 752c505：改成增量构建之前的最后一个 commit
    - run: python tests/closed_loop.py --legacy-ref 752c5050819114d49cc07aac677a06e64ef3cf51
